<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640">
  <defs>
    <radialGradient id="vapor"><stop offset=".2" stop-color="#fff" stop-opacity=".96"/><stop offset=".64" stop-color="#f4f5f3" stop-opacity=".86"/><stop offset="1" stop-color="#e9eceb" stop-opacity="0"/></radialGradient>
    <radialGradient id="shade"><stop stop-color="#7f8b94" stop-opacity=".4"/><stop offset="1" stop-color="#adb6ba" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun"><stop stop-color="#fffef9" stop-opacity=".96"/><stop offset=".58" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="filter-back" x="-35%" y="-55%" width="170%" height="210%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="170" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="filter-mid" x="-35%" y="-55%" width="170%" height="210%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="filter-front" x="-35%" y="-55%" width="170%" height="210%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation=".8"/>
    </filter>
  </defs>
  <!-- The supplied three-layer displacement technique, viewed from directly above. -->
  <g id="cloud-back" filter="url(#filter-back)" fill="url(#vapor)">
    <ellipse cx="246" cy="337" rx="170" ry="112"/><ellipse cx="399" cy="282" rx="181" ry="152"/>
    <ellipse cx="559" cy="351" rx="194" ry="140"/><ellipse cx="727" cy="300" rx="166" ry="122"/>
    <ellipse cx="818" cy="345" rx="110" ry="81"/>
  </g>
  <g id="cloud-mid" filter="url(#filter-mid)" fill="url(#shade)">
    <ellipse cx="324" cy="375" rx="127" ry="60"/><ellipse cx="491" cy="340" rx="154" ry="104"/>
    <ellipse cx="660" cy="393" rx="145" ry="68"/><ellipse cx="786" cy="329" rx="97" ry="74"/>
  </g>
  <g id="cloud-front" filter="url(#filter-front)" fill="url(#sun)">
    <ellipse cx="244" cy="309" rx="115" ry="73"/><ellipse cx="370" cy="252" rx="126" ry="103"/>
    <ellipse cx="525" cy="305" rx="126" ry="88"/><ellipse cx="624" cy="349" rx="118" ry="79"/>
    <ellipse cx="736" cy="271" rx="113" ry="72"/>
  </g>
</svg>
